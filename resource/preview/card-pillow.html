<!doctype html><html><head><meta charset="utf-8"><title>card-pillow.html</title><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<style>
  .pc { background: var(--pastel-lavender); border-radius: 28px; padding: 22px 24px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 12px 32px -16px rgba(122,90,248,0.5); position: relative; overflow:hidden; min-height: 150px;}
  .pc h3 { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -0.02em; color: var(--ink); margin: 0;}
  .pc p { font-size: 13px; color: var(--ink); margin: 6px 0 14px 0; opacity: 0.85;}
  .pc .av { display:flex;}
  .pc .av span { width: 26px; height: 26px; border-radius: 999px; border: 2.5px solid var(--pastel-lavender); margin-left: -8px;}
  .pc .av span:first-child { margin-left: 0;}
  .pc img.blob { position:absolute; right: -8px; top: -8px; width: 160px; }
</style>
<div class="pc">
  <h3>Daily<br/>challenge</h3>
  <p>Do your plan before 09:00 AM</p>
  <div class="av">
    <span style="background:#FFC79A;"></span>
    <span style="background:#BDE8C9;"></span>
    <span style="background:#F7BFD7;"></span>
    <span style="background:var(--ink); color: var(--paper); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; margin-left:-8px;">+4</span>
  </div>
  <img class="blob" src="../assets/blobs/cluster-warm.svg" alt=""/>
</div></div></body></html>
