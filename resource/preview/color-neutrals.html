<!doctype html><html><head><meta charset="utf-8"><title>color-neutrals.html</title><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<style>
  .row3 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .sw { display:flex; flex-direction:column; gap:8px; }
  .chip { height: 70px; border-radius: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 2px 8px -2px rgba(20,21,43,0.08); }
  .meta-row { display:flex; flex-direction:column; }
  .n { font-size: 12px; font-weight: 600; color: var(--ink); }
  .h { font-family: var(--font-mono); font-size: 10.5px; color: var(--smoke); }
</style>
<div class="label" style="margin-bottom:10px;">Neutrals · warm, never pure gray</div>
<div class="row3">
  
  <div class="sw">
    <div class="chip" style="background:#14152B;"></div>
    <div class="meta-row">
      <div class="n">ink</div>
      <div class="h">#14152B</div>
    </div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#5B5C72;"></div>
    <div class="meta-row">
      <div class="n">smoke</div>
      <div class="h">#5B5C72</div>
    </div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#A8ABB9;"></div>
    <div class="meta-row">
      <div class="n">mist</div>
      <div class="h">#A8ABB9</div>
    </div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#E8E9F0;"></div>
    <div class="meta-row">
      <div class="n">cloud</div>
      <div class="h">#E8E9F0</div>
    </div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#FBFAF7;"></div>
    <div class="meta-row">
      <div class="n">paper</div>
      <div class="h">#FBFAF7</div>
    </div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#FFFFFF;"></div>
    <div class="meta-row">
      <div class="n">pure</div>
      <div class="h">#FFFFFF</div>
    </div>
  </div>
</div></div></body></html>
