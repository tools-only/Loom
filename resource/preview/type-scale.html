<!doctype html><html><head><meta charset="utf-8"><title>type-scale.html</title><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<style>
  .scale-list { display:flex; flex-direction:column; gap:6px; }
  .scale-row { display:flex; align-items:baseline; gap:14px; }
  .scale-row .lbl { font-family: var(--font-mono); font-size:11px; color:var(--smoke); width:78px; }
  .scale-row .demo { font-family: var(--font-body); font-weight:700; color:var(--ink); white-space:nowrap; }
  .scale-row .display { font-family: var(--font-display); font-weight:800; letter-spacing:-0.02em; }
</style>
<div class="label" style="margin-bottom:10px;">Type scale</div>
<div class="scale-list">
  <div class="scale-row"><span class="lbl">poster · 96</span><span class="demo display" style="font-size:42px;">Aa</span></div>
  <div class="scale-row"><span class="lbl">display · 64</span><span class="demo display" style="font-size:32px;">Aa Bloom</span></div>
  <div class="scale-row"><span class="lbl">h1 · 44</span><span class="demo" style="font-size:26px;">Aa Heading 1</span></div>
  <div class="scale-row"><span class="lbl">h2 · 32</span><span class="demo" style="font-size:22px;">Aa Heading 2</span></div>
  <div class="scale-row"><span class="lbl">h3 · 22</span><span class="demo" style="font-size:18px;">Aa Heading 3</span></div>
  <div class="scale-row"><span class="lbl">body · 16</span><span class="demo" style="font-size:14px; font-weight:500;">Aa Body text</span></div>
  <div class="scale-row"><span class="lbl">small · 14 / 12</span><span class="demo" style="font-size:12px; font-weight:500; color:var(--smoke);">Aa Caption</span></div>
</div></div></body></html>
