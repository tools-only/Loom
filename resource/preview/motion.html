<!doctype html><html><head><meta charset="utf-8"><title>motion.html</title><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<style>
  .mrow { display:flex; gap:14px; flex-wrap:wrap;}
  .mc { background: var(--bg-2); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow-sm); display:flex; flex-direction:column; gap:6px; min-width: 120px;}
  .mc .v { font-family: var(--font-mono); font-size: 11px; color: var(--accent-iris); }
  .mc .n { font-size: 12px; color: var(--ink); font-weight:600;}
  .ball-track { background: var(--cloud); height: 26px; border-radius: 999px; position:relative; overflow:hidden; margin-top: 12px;}
  .ball { position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:999px; background: var(--accent-iris); animation: slide 1.6s cubic-bezier(0.32,0.72,0,1) infinite;}
  @keyframes slide { 0%, 30% { left: 3px;} 50%, 80% { left: calc(100% - 23px);} 100% { left:3px;} }
</style>
<div class="label" style="margin-bottom:8px;">Motion · cubic-bezier(0.32, 0.72, 0, 1)</div>
<div class="mrow">
  <div class="mc"><span class="n">fast</span><span class="v">160ms</span></div>
  <div class="mc"><span class="n">base</span><span class="v">200ms</span></div>
  <div class="mc"><span class="n">medium</span><span class="v">280ms</span></div>
  <div class="mc"><span class="n">slow</span><span class="v">480ms</span></div>
</div>
<div class="ball-track"><div class="ball"></div></div></div></body></html>
