<!doctype html><html><head><meta charset="utf-8"><title>badges.html</title><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<style>
  .b { display:inline-flex; align-items:center; gap:6px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; font-family: var(--font-body); }
  .dot { width: 6px; height: 6px; border-radius: 999px; }
  .row6 { display:flex; gap: 8px; flex-wrap: wrap;}
  .row6 + .row6 { margin-top: 10px;}
</style>
<div class="label" style="margin-bottom:10px;">Badges & tags</div>
<div class="row6">
  <span class="b" style="background: var(--pastel-mint); color: #1F7F4F;"><span class="dot" style="background:#2BB673;"></span>Active</span>
  <span class="b" style="background: var(--pastel-butter); color: #A35E0C;">Medium</span>
  <span class="b" style="background: var(--pastel-sky); color: #1E5C7A;">Light</span>
  <span class="b" style="background: var(--ink); color: var(--paper);">25 Nov</span>
  <span class="b" style="background: var(--accent-lime); color: var(--ink);">+400</span>
  <span class="b" style="background: var(--accent-pink); color: #fff;">New</span>
</div>
<div class="row6">
  <span class="b" style="background: #FBD9D9; color: #9F2A2A;"><span class="dot" style="background:#E04848;"></span>Overdue</span>
  <span class="b" style="background: #E7E2FE; color: #3F2BB1;">Info</span>
  <span class="b" style="background: var(--cloud); color: var(--smoke);">Draft</span>
  <span class="b" style="background: transparent; color: var(--ink); border: 1.5px solid var(--ink);">Outline</span>
</div></div></body></html>
