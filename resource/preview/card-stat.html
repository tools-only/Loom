<!doctype html><html><head><meta charset="utf-8"><title>card-stat.html</title><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<style>
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;}
  .stat { padding: 14px 16px; border-radius: 20px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);}
  .stat .l { font-size: 12px; color: var(--ink); opacity: 0.7; font-weight: 600;}
  .stat .v { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -0.02em; color: var(--ink); line-height: 1.1; margin-top: 4px;}
  .stat .u { font-family: var(--font-body); font-size: 14px; color: var(--ink); opacity: 0.75; font-weight: 500;}
</style>
<div class="label" style="margin-bottom:10px;">Stat cards · pastel pillows with display numerals</div>
<div class="stat-row">
  <div class="stat" style="background: var(--pastel-mint);"><div class="l">Start weight</div><div class="v">53.3 <span class="u">kg</span></div></div>
  <div class="stat" style="background: var(--pastel-sky);"><div class="l">Goal</div><div class="v">50.0 <span class="u">kg</span></div></div>
  <div class="stat" style="background: var(--pastel-peach);"><div class="l">Daily calories</div><div class="v">740 <span class="u">kcal</span></div></div>
</div></div></body></html>
