<!doctype html><html><head><meta charset="utf-8"><title>progress-rainbow.html</title><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<style>
  .pwrap { background: #0A0A14; padding: 20px 22px; border-radius: 22px; }
  .pr-label { color: #F2F2F7; font-weight: 700; font-size: 14px; margin-bottom: 10px;}
  .pr-track { height: 18px; background: #1F2138; border-radius: 999px; position: relative; overflow: hidden;}
  .pr-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 68%; background: linear-gradient(90deg, #7A5AF8 0%, #C36AE2 35%, #FF5BA4 65%, #FF9270 90%, #FFC79A 100%); border-radius: 999px;}
  .pr-bars { display:flex; gap: 2px; align-items: center; padding: 4px;}
  .pr-bars span { background: #1F2138; flex:1; height: 10px; border-radius: 2px;}
  .pr-bars span.on { background: linear-gradient(90deg, #7A5AF8, #FF5BA4); height: 14px;}
  .pr-bars { position:absolute; inset:0;}
  .pr-marks { display:flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: #A8ABB9; font-family: var(--font-mono);}
</style>
<div class="pwrap">
  <div class="pr-label">Completion</div>
  <div class="pr-track">

    </div>
  </div>
  <div class="pr-marks"><span>Amiguis</span><span>Super Amiguis</span><span>Reinas</span></div>
</div></div></body></html>
