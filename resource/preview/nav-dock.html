<!doctype html><html><head><meta charset="utf-8"><title>nav-dock.html</title><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<style>
  .doc-bg { background: linear-gradient(180deg, var(--pastel-sky) 0%, var(--paper) 100%); padding: 36px 24px; border-radius: 20px;}
  .dock { background: var(--ink); border-radius: 999px; padding: 6px; display: flex; align-items: center; gap: 6px; box-shadow: 0 20px 48px -16px rgba(20,21,43,0.35); margin: 0 auto; width: fit-content;}
  .dock .item { width: 44px; height: 44px; border-radius: 999px; display:flex; align-items:center; justify-content:center;}
  .dock .item.active { background: var(--paper);}
  .ico { width: 18px; height: 18px; border: 2px solid var(--mist); border-radius: 5px;}
  .dock .item.active .ico { border-color: var(--ink);}
</style>
<div class="doc-bg">
  <div class="dock">
    <div class="item active"><div class="ico" style="border-radius:6px;"></div></div>
    <div class="item"><div class="ico" style="display:grid; grid-template-columns:1fr 1fr; gap:2px; border:0; width:18px; height:18px;"><span style="background:var(--mist); border-radius:2px;"></span><span style="background:var(--mist); border-radius:2px;"></span><span style="background:var(--mist); border-radius:2px;"></span><span style="background:var(--mist); border-radius:2px;"></span></div></div>
    <div class="item"><div class="ico" style="border:0; width:18px; height:18px; display:flex; align-items:flex-end; gap:2px;"><span style="background:var(--mist); width:4px; height:8px; border-radius:2px;"></span><span style="background:var(--mist); width:4px; height:14px; border-radius:2px;"></span><span style="background:var(--mist); width:4px; height:18px; border-radius:2px;"></span></div></div>
    <div class="item"><div class="ico" style="border:0; width:16px; height:16px; background:var(--mist); border-radius:999px;"></div></div>
  </div>
</div></div></body></html>
