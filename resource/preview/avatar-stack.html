<!doctype html><html><head><meta charset="utf-8"><title>avatar-stack.html</title><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<style>
  .a-row { display: flex; align-items: center; gap: 18px; padding: 8px 0;}
  .a-stack { display: flex;}
  .av { width: 44px; height: 44px; border-radius: 999px; border: 3px solid var(--paper); margin-left: -10px; box-shadow: 0 2px 8px rgba(20,21,43,0.1);}
  .av:first-child { margin-left: 0;}
  .av.l { background: linear-gradient(135deg, #FFC79A, #FF5BA4);}
  .av.m { background: linear-gradient(135deg, #BDE8C9, #3DD3F5);}
  .av.p { background: linear-gradient(135deg, #D4C5F9, #7A5AF8);}
  .av.b { background: linear-gradient(135deg, #FFE48A, #FFC79A);}
  .av.plus { background: var(--ink); color: var(--paper); display:flex; align-items:center; justify-content:center; font-weight: 800; font-size: 13px; }
  .single { width: 56px; height: 56px;}
</style>
<div class="label" style="margin-bottom:10px;">Avatars · circular, paper border</div>
<div class="a-row">
  <div class="av single l"></div>
  <div class="a-stack">
    <div class="av l"></div>
    <div class="av m"></div>
    <div class="av p"></div>
    <div class="av plus">+4</div>
  </div>
</div></div></body></html>
