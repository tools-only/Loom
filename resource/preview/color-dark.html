<!doctype html><html><head><meta charset="utf-8"><title>color-dark.html</title><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<style>
  .dark { background: #0A0A14; border-radius: 20px; padding: 18px 20px; color: #F2F2F7;}
  .dark .row3 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .dark .sw { display:flex; flex-direction:column; gap:6px; }
  .dark .chip { height:60px; border-radius: 14px; }
  .dark .n { font-size:12px; font-weight:600; color: #F2F2F7; }
  .dark .h { font-family: var(--font-mono); font-size: 10.5px; color: #A8ABB9;}
  .dark-label { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#A8ABB9; margin-bottom:10px;}
</style>
<div class="dark">
  <div class="dark-label">Dark mode · radial wash + electric accent</div>
  <div class="row3">
    <div class="sw"><div class="chip" style="background:#0A0A14;"></div><div class="n">bg</div><div class="h">#0A0A14</div></div>
    <div class="sw"><div class="chip" style="background:#16172A;"></div><div class="n">surface</div><div class="h">#16172A</div></div>
    <div class="sw"><div class="chip" style="background:#1F2138;"></div><div class="n">raised</div><div class="h">#1F2138</div></div>
    <div class="sw"><div class="chip" style="background:#7A5AF8; box-shadow: 0 0 24px rgba(122,90,248,0.55);"></div><div class="n">iris·glow</div><div class="h">#7A5AF8</div></div>
  </div>
</div></div></body></html>
