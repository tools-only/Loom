<!doctype html><html><head><meta charset="utf-8"><title>spacing-scale.html</title><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<style>
  .sp-row { display:flex; align-items:flex-end; gap: 16px; height: 88px;}
  .sp { display:flex; flex-direction:column; align-items:center; gap:6px; font-family: var(--font-mono); font-size:10px; color: var(--smoke);}
  .sp .b { background: var(--accent-iris); border-radius: 6px; width: 14px;}
  .sp .v { color: var(--ink); font-weight: 600; font-size: 11px; }
</style>
<div class="label" style="margin-bottom:8px;">Spacing · 4-px base scale</div>
<div class="sp-row">
  <div class="sp"><div class="b" style="height: 4px;"></div><span class="v">4</span><span>s-1</span></div>
  <div class="sp"><div class="b" style="height: 8px;"></div><span class="v">8</span><span>s-2</span></div>
  <div class="sp"><div class="b" style="height: 12px;"></div><span class="v">12</span><span>s-3</span></div>
  <div class="sp"><div class="b" style="height: 16px;"></div><span class="v">16</span><span>s-4</span></div>
  <div class="sp"><div class="b" style="height: 24px;"></div><span class="v">24</span><span>s-5</span></div>
  <div class="sp"><div class="b" style="height: 32px;"></div><span class="v">32</span><span>s-6</span></div>
  <div class="sp"><div class="b" style="height: 48px;"></div><span class="v">48</span><span>s-7</span></div>
  <div class="sp"><div class="b" style="height: 64px;"></div><span class="v">64</span><span>s-8</span></div>
</div></div></body></html>
