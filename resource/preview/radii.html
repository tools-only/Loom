<!doctype html><html><head><meta charset="utf-8"><title>radii.html</title><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<style>
  .rrow { display:grid; grid-template-columns: repeat(7,1fr); gap: 10px;}
  .rb { background: var(--pastel-lavender); height: 78px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 2px 8px -2px rgba(20,21,43,0.08);}
  .rl { font-family: var(--font-mono); font-size:10px; color:var(--smoke); text-align:center; margin-top:4px;}
  .rn { font-size:11px; color:var(--ink); font-weight:600; text-align:center;}
</style>
<div class="label" style="margin-bottom:10px;">Corner radii · everything rounds</div>
<div class="rrow">
  <div><div class="rb" style="border-radius:8px;"></div><div class="rn">xs</div><div class="rl">8px</div></div>
  <div><div class="rb" style="border-radius:12px;"></div><div class="rn">sm</div><div class="rl">12px</div></div>
  <div><div class="rb" style="border-radius:16px;"></div><div class="rn">md</div><div class="rl">16px</div></div>
  <div><div class="rb" style="border-radius:24px;"></div><div class="rn">lg</div><div class="rl">24px</div></div>
  <div><div class="rb" style="border-radius:32px;"></div><div class="rn">xl</div><div class="rl">32px</div></div>
  <div><div class="rb" style="border-radius:48px;"></div><div class="rn">2xl</div><div class="rl">48px</div></div>
  <div><div class="rb" style="border-radius:999px;"></div><div class="rn">pill</div><div class="rl">999px</div></div>
</div></div></body></html>
