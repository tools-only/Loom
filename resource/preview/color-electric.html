<!doctype html><html><head><meta charset="utf-8"><title>color-electric.html</title><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<style>

<style>
  .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

<div class="row4">
  <div class="sw"><div class="chip-lg" style="background:#C9F542;"></div><div class="n">lime</div><div class="h">#C9F542</div></div>
  <div class="sw"><div class="chip-lg" style="background:#FF5BA4;"></div><div class="n">hot pink</div><div class="h">#FF5BA4</div></div>
  <div class="sw"><div class="chip-lg" style="background:#7A5AF8;"></div><div class="n">iris</div><div class="h">#7A5AF8</div></div>
  <div class="sw"><div class="chip-lg" style="background:#3DD3F5;"></div><div class="n">cyan</div><div class="h">#3DD3F5</div></div>
</div></div></body></html>
