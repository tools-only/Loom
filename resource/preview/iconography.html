<!doctype html><html><head><meta charset="utf-8"><title>iconography.html</title><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
  .ico-row { display:flex; gap: 24px; align-items: center; padding: 8px 0;}
  .ico-bubble { width: 56px; height: 56px; border-radius: 999px; display:flex; align-items:center; justify-content:center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 4px 12px -4px rgba(20,21,43,0.1);}
  .ico-bubble i { font-size: 28px; color: var(--ink);}
  .ico-strip { display:flex; gap: 16px; align-items:center;}
  .ico-strip i { font-size: 24px; color: var(--ink);}
</style>
<div class="label" style="margin-bottom:10px;">Iconography · Phosphor Bold (rounded line endings)</div>
<div class="ico-row">
  <div class="ico-bubble" style="background:var(--pastel-peach);"><i class="ph-bold ph-trophy"></i></div>
  <div class="ico-bubble" style="background:var(--pastel-mint);"><i class="ph-bold ph-heartbeat"></i></div>
  <div class="ico-bubble" style="background:var(--pastel-sky);"><i class="ph-bold ph-map-trifold"></i></div>
  <div class="ico-bubble" style="background:var(--pastel-petal);"><i class="ph-bold ph-sparkle"></i></div>
  <div style="flex:1;"></div>
  <div class="ico-strip">
    <i class="ph-bold ph-house"></i>
    <i class="ph-bold ph-squares-four"></i>
    <i class="ph-bold ph-chart-bar"></i>
    <i class="ph-bold ph-user"></i>
    <i class="ph-bold ph-gear-six"></i>
  </div>
</div></div></body></html>
