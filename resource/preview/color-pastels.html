<!doctype html><html><head><meta charset="utf-8"><title>color-pastels.html</title><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<style>
  .row3 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .sw { display:flex; flex-direction:column; gap:8px; }
  .chip { height: 70px; border-radius: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 2px 8px -2px rgba(20,21,43,0.08); }
  .meta-row { display:flex; flex-direction:column; }
  .n { font-size: 12px; font-weight: 600; color: var(--ink); }
  .h { font-family: var(--font-mono); font-size: 10.5px; color: var(--smoke); }
</style>
<div class="label" style="margin-bottom:10px;">Pastel surfaces · cards & section blocks</div>
<div class="row3">
  
  <div class="sw">
    <div class="chip" style="background:#D4C5F9;"></div>
    <div class="meta-row">
      <div class="n">lavender</div>
      <div class="h">#D4C5F9</div>
    </div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#FFC79A;"></div>
    <div class="meta-row">
      <div class="n">peach</div>
      <div class="h">#FFC79A</div>
    </div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#BDE8C9;"></div>
    <div class="meta-row">
      <div class="n">mint</div>
      <div class="h">#BDE8C9</div>
    </div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#BFDDEE;"></div>
    <div class="meta-row">
      <div class="n">sky</div>
      <div class="h">#BFDDEE</div>
    </div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#F7BFD7;"></div>
    <div class="meta-row">
      <div class="n">petal</div>
      <div class="h">#F7BFD7</div>
    </div>
  </div>
  
  <div class="sw">
    <div class="chip" style="background:#FFE48A;"></div>
    <div class="meta-row">
      <div class="n">butter</div>
      <div class="h">#FFE48A</div>
    </div>
  </div>
</div></div></body></html>
