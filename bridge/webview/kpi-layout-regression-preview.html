<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="resource/colors_and_type.css">
  <link rel="stylesheet" href="styles.css">
  <title>KPI layout regression preview</title>
</head>
<body>
  <main id="anchor-stage">
    <div id="anchor-content">
      <section class="anc-section anc-section--gc" data-anc="macro">
        <h2>全球主要指数（周五收盘）</h2>
        <div class="anc-kpi-grid">
          <div class="anc-kpi"><div class="kpi-top"><div class="kpi-label-top">S&amp;P 500<br>SPX</div></div><div class="kpi-bottom"><div class="kpi-value">5,847</div><div class="kpi-unit">-0.3% 周五收盘</div></div></div>
          <div class="anc-kpi anc-kpi--cool"><div class="kpi-top"><div class="kpi-label-top">纳斯达克<br>NDX</div></div><div class="kpi-bottom"><div class="kpi-value">21,234</div><div class="kpi-unit">-0.5% 周五收盘</div></div></div>
          <div class="anc-kpi anc-kpi--arctic"><div class="kpi-top"><div class="kpi-label-top">道琼斯<br>DJIA</div></div><div class="kpi-bottom"><div class="kpi-value">42,156</div><div class="kpi-unit">+0.1% 周五收盘</div></div></div>
          <div class="anc-kpi anc-kpi--flame"><div class="kpi-top"><div class="kpi-label-top">VIX<br>恐慌指数</div></div><div class="kpi-bottom"><div class="kpi-value">17.4</div><div class="kpi-unit">+0.8 周五</div></div></div>
          <div class="anc-kpi anc-kpi--warm"><div class="kpi-top"><div class="kpi-label-top">10Y 美债<br>收益率</div></div><div class="kpi-bottom"><div class="kpi-value">4.52%</div><div class="kpi-unit">+3bp 周五</div></div></div>
          <div class="anc-kpi anc-kpi--aurora"><div class="kpi-top"><div class="kpi-label-top">美元指数<br>DXY</div></div><div class="kpi-bottom"><div class="kpi-value">103.2</div><div class="kpi-unit">-0.2% 周五</div></div></div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
