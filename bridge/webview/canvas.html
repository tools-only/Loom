<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas · Loom</title>
<link rel="stylesheet" href="resource/colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="canvas-styles.css">
</head>
<!-- html2canvas for PNG export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<body>

<!-- Toolbar -->
<div id="canvas-toolbar">
  <i class="ph-bold ph-squares-four" style="font-size:18px;color:var(--accent-brand,#7A5AF8)"></i>
  <h1>Canvas</h1>
  <span class="canvas-status" id="canvas-status">Connecting…</span>
  <span class="canvas-sel-badge" id="canvas-sel-badge"></span>
  <span style="flex:1"></span>
  <button class="canvas-tool-btn active" id="canvas-snap-btn" title="Snap to grid (toggle)">
    <i class="ph-bold ph-dots-nine"></i>
  </button>
  <button class="canvas-tool-btn" id="canvas-connect-btn" title="Connect cards (C)">
    <i class="ph-bold ph-arrow-up-right"></i>
  </button>
  <button class="canvas-tool-btn" id="canvas-export-btn" title="Export PNG">
    <i class="ph-bold ph-download-simple"></i>
  </button>
  <a href="/" style="font-size:13px;color:var(--ink);opacity:0.5;text-decoration:none;padding:6px;margin-left:4px;">
    <i class="ph-bold ph-x"></i>
  </a>
</div>

<!-- Canvas area -->
<div id="canvas-viewport">
  <div id="canvas-stage">
    <!-- SVG connector layer (below cards via z-index) -->
    <svg id="canvas-connectors" style="position:absolute;top:0;left:0;width:3000px;height:2000px;overflow:visible;z-index:0;pointer-events:none;">
      <defs>
        <marker id="canvas-arrow" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 9 3.5, 0 7" fill="#7A5AF8" fill-opacity="0.6"/>
        </marker>
      </defs>
    </svg>
    <!-- Cards inserted here by canvas-client.js -->
  </div>
  <div id="canvas-empty">
    <div class="canvas-empty-icon"><i class="ph-bold ph-magic-wand"></i></div>
    <p>在下方输入，让 AI 在画布上生成内容卡片<br>拖动、旋转、缩放，选中后可继续提要求</p>
  </div>
  <div id="canvas-marquee"></div>
</div>

<!-- Layout suggestion bar (hidden until agent proposes rearrangement) -->
<div id="canvas-suggestion-bar" class="canvas-suggestion-bar hidden">
  <i class="ph-bold ph-magic-wand"></i>
  <span id="canvas-suggestion-label">AI 建议重排</span>
  <button class="btn btn--brand btn--sm" id="canvas-suggestion-accept">接受</button>
  <button class="btn btn--ghost btn--sm" id="canvas-suggestion-reject">拒绝</button>
</div>

<!-- Prompt bar -->
<div id="canvas-prompt-bar">
  <input
    id="canvas-prompt-input"
    type="text"
    placeholder="描述你想在画布上生成的内容…"
    autocomplete="off"
    spellcheck="false"
  />
  <button id="canvas-prompt-send" title="发送 (Enter)">
    <i class="ph-bold ph-paper-plane-tilt"></i>
  </button>
</div>

<script src="canvas-client.js"></script>
</body>
</html>
