<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loom — Live View</title>
<link rel="stylesheet" href="resource/colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Animated glass background -->
<div class="refraction-bg">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="light light1"></div>
  <div class="light light2"></div>
  <div class="grain"></div>
</div>

<header id="anchor-toolbar">
  <img class="toolbar-logo" src="assets/logo-mark.svg" alt="Bloom" width="32" height="32">
  <span class="toolbar-brand">Loom</span>
  <span class="toolbar-status" id="status">connecting...</span>
  <span class="toolbar-processing" id="processing" style="display:none">
    <span class="processing-dot"></span>
    <span class="processing-label">AI 处理中</span>
    <span class="processing-target"></span>
  </span>
  <span class="toolbar-info" id="info"></span>
</header>

<!-- Floating trigger tabs (right edge, stacked) -->
<div class="anc-panel-trigger" id="trigger-context" title="Context">
  ● Context
</div>
<div class="anc-panel-trigger" id="trigger-timeline" title="Timeline">
  ● Timeline
</div>

<!-- Context configuration panel (floating overlay, right side) -->
<aside id="anchor-context-panel" class="anc-side-panel collapsed">
  <div class="side-panel-header">
    <span class="side-panel-title">Context</span>
    <button class="side-panel-toggle" data-target="anchor-context-panel">×</button>
  </div>
  <div class="side-panel-body">
    <details open data-group="memory">
      <summary>Memory <span class="group-count">0</span></summary>
      <input type="search" class="group-filter" placeholder="filter memory...">
      <div class="group-list"></div>
    </details>
    <details data-group="skills">
      <summary>Skills <span class="group-count">0</span></summary>
      <input type="search" class="group-filter" placeholder="filter skills...">
      <div class="group-list"></div>
    </details>
    <details data-group="subagents">
      <summary>Subagents <span class="group-count">0</span></summary>
      <input type="search" class="group-filter" placeholder="filter subagents...">
      <div class="group-list"></div>
    </details>
    <details data-group="resources">
      <summary>Resources <span class="group-count">0</span></summary>
      <input type="search" class="group-filter" placeholder="filter resources...">
      <div class="group-list"></div>
      <div class="resource-form">
        <input type="text" class="resource-name-input" placeholder="Resource name...">
        <input type="url" class="resource-url-input" placeholder="https://...">
        <button class="btn btn--sm btn--brand resource-add-btn">+ Add</button>
      </div>
    </details>
    <details data-group="history">
      <summary>History <span class="group-count">0</span></summary>
      <div class="group-list"></div>
    </details>
  </div>
</aside>

<!-- Agent process timeline (floating overlay, right side) -->
<aside id="anchor-timeline-panel" class="anc-side-panel collapsed">
  <div class="side-panel-header">
    <span class="side-panel-title">Timeline</span>
    <button class="side-panel-toggle" data-target="anchor-timeline-panel">×</button>
  </div>
  <div class="side-panel-body">
    <div id="timeline-events"></div>
  </div>
</aside>

<div id="anchor-shell">

  <!-- Center: rendered anchor content -->
  <main id="anchor-stage">
    <div id="anchor-content"></div>
  </main>

</div>

<!-- Phase 3 — Floating selection toolbar (positioned dynamically) -->
<div id="anchor-floating-toolbar" class="anc-floating-toolbar hidden">
  <button class="btn btn--sm" data-op="refine">✦ Refine</button>
  <button class="btn btn--sm" data-op="annotate">✎ Annotate</button>
  <button class="btn btn--sm" data-op="branch">⑂ Branch</button>
  <button class="btn btn--sm" data-op="ask">? Ask</button>
</div>

<script src="anchor-client.js"></script>

<!-- Global Execute All button -->
<div id="anchor-execute-all" class="hidden">
  <button class="btn btn--brand execute-all-btn">
    <span class="execute-icon">▶</span>
    <span class="execute-label">Execute All</span>
  </button>
  <span class="execute-badge">0</span>
</div>
</body>
</html>
