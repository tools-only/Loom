<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Loom</title>
<link rel="stylesheet" href="resource/colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="loom-detail-overlay.css">
</head>
<body>

<!-- ── Status pill ────────────────────────────── -->
<span class="mob-status" id="mob-status">connecting…</span>

<!-- ══ Routes ══════════════════════════════════════════════ -->

<!-- Home -->
<section data-route="home">
  <div id="mob-home-empty">
    <div class="mob-home-eyebrow">AI-Native Mobile</div>
    <h1>Think it.<br>Live it.</h1>
    <div class="mob-prompt">
      <input id="mob-prompt-input" type="text" placeholder="今日市场简报…" autocomplete="off" autocorrect="off">
      <button id="mob-prompt-submit"><i class="ph-bold ph-arrow-right"></i></button>
    </div>
    <div class="mob-suggestions">
      <button data-prompt="\market 今日市场简报：宏观信号、板块轮动、风险事件">
        <span>今日市场简报</span>
        <i class="ph-bold ph-chart-bar"></i>
      </button>
      <button data-prompt="\sentiment 合成市场情绪摘要">
        <span>情绪追踪</span>
        <i class="ph-bold ph-activity"></i>
      </button>
      <button data-prompt="\target 跟踪 NVDA、AAPL、TSLA">
        <span>标的跟踪</span>
        <i class="ph-bold ph-crosshair-simple"></i>
      </button>
      <button data-prompt="\position 交易复盘">
        <span>交易复盘</span>
        <i class="ph-bold ph-arrows-clockwise"></i>
      </button>
    </div>
  </div>

  <!-- AI-rendered anchor content -->
  <div id="anchor-content" hidden></div>
</section>

<!-- Activity -->
<section data-route="activity" hidden>
  <header class="mob-route-header">
    <h1>Activity</h1>
  </header>
  <div id="mob-activity-list">
    <p class="mob-empty">No activity yet</p>
  </div>
</section>

<!-- Inbox -->
<section data-route="inbox" hidden>
  <header class="mob-route-header">
    <h1>Inbox</h1>
  </header>
  <div id="mob-inbox-list">
    <p class="mob-empty">No messages yet</p>
  </div>
</section>

<!-- Settings -->
<section data-route="settings" hidden>
  <header class="mob-route-header">
    <h1>Settings</h1>
  </header>
  <div id="mob-settings">
    <h2>AI Hand</h2>
    <div class="mob-settings-row"><span>Active hand</span><span class="mob-settings-val">(default)</span></div>
    <h2>Session</h2>
    <div class="mob-settings-row"><span>Status</span><span class="mob-settings-val">Connecting…</span></div>
  </div>
</section>

<!-- ── Sticky prompt bar (shown after first render) ──────── -->
<div class="mob-prompt-bar" id="mob-prompt-bar" hidden>
  <input id="mob-bar-input" type="text" placeholder="New prompt…" autocomplete="off" autocorrect="off">
  <button id="mob-bar-submit"><i class="ph-bold ph-arrow-right"></i></button>
</div>

<!-- ── Bottom navigation ──────────────────────────────────── -->
<nav class="mob-bottom-nav">
  <button class="mob-nav-btn is-active" data-route="home">
    <i class="ph-bold ph-house"></i>
    <span>Home</span>
  </button>
  <button class="mob-nav-btn" data-route="activity">
    <i class="ph-bold ph-pulse"></i>
    <span>Activity</span>
  </button>
  <button class="mob-nav-btn" data-route="inbox">
    <i class="ph-bold ph-tray"></i>
    <span>Inbox</span>
  </button>
  <button class="mob-nav-btn" data-route="settings">
    <i class="ph-bold ph-gear"></i>
    <span>Settings</span>
  </button>
</nav>

<!-- ── Selection action bar ───────────────────────────────── -->
<div class="mob-sel-bar" id="mob-sel-bar" hidden>
  <button class="mob-sel-btn" data-op="ask">Ask</button>
  <button class="mob-sel-btn" data-op="refine">Refine</button>
  <button class="mob-sel-btn" data-op="annotate">Annotate</button>
</div>

<!-- ── Toast ──────────────────────────────────────────────── -->
<div class="anc-toast" id="toast"></div>

<!-- ══ Scripts ════════════════════════════════════════════ -->
<script src="timing-waterfall.js"></script>
<script src="loom-detail-overlay.js"></script>
<script src="mobile-lib/anchor-envelope.js"></script>
<script src="mobile-lib/anchor-ws.js"></script>
<script src="mobile-lib/anchor-patch.js"></script>
<script src="mobile/mobile-routes.js"></script>
<script src="mobile/mobile-anchor.js"></script>
<script src="mobile/mobile-selection.js"></script>
<script src="mobile/mobile-app.js"></script>

</body>
</html>
